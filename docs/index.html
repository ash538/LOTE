<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>LOTE Quote Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f7fa;color:#1a1a2e;line-height:1.6}
.header{background:#1a1a2e;color:#fff;padding:14px 0;position:sticky;top:0;z-index:100}
.header .container{display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:1.2rem}
.header nav a{color:#cbd5e1;margin-left:16px;font-weight:500;font-size:.9rem;cursor:pointer;text-decoration:none}
.header nav a:hover,.header nav a.active{color:#fff}
.container{max-width:1000px;margin:0 auto;padding:0 16px}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:20px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border:none;border-radius:6px;font-size:.85rem;font-weight:500;cursor:pointer;transition:all .15s}
.btn:hover{opacity:.9}
.btn-primary{background:#2563eb;color:#fff}
.btn-success{background:#16a34a;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-secondary{background:#e2e8f0;color:#475569}
.btn-sm{padding:5px 10px;font-size:.78rem}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.82rem;font-weight:600;color:#475569;margin-bottom:3px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:.88rem}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#2563eb}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #e2e8f0;font-size:.85rem}
th{font-size:.75rem;font-weight:600;text-transform:uppercase;color:#64748b;letter-spacing:.4px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:600;text-transform:capitalize}
.badge-draft{background:#fef3c7;color:#92400e}
.badge-sent{background:#dbeafe;color:#1e40af}
.badge-accepted{background:#dcfce7;color:#166534}
.badge-declined{background:#fee2e2;color:#991b1b}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
.page-header{display:flex;justify-content:space-between;align-items:center;margin:20px 0 16px}
.page-header h2{font-size:1.2rem}
.totals-section{margin-top:16px;border-top:2px solid #e2e8f0;padding-top:12px}
.totals-row{display:flex;justify-content:flex-end;gap:30px;padding:3px 10px;font-size:.9rem}
.totals-row.total{font-size:1.1rem;font-weight:700;border-top:2px solid #1a1a2e;padding-top:6px;margin-top:4px}
.totals-label{color:#64748b;min-width:120px;text-align:right}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:#fff;border-radius:12px;padding:24px;width:95%;max-width:600px;max-height:85vh;overflow-y:auto}
.modal h3{margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.empty-state{text-align:center;padding:40px 16px;color:#94a3b8}
.empty-state h3{font-size:1.1rem;margin-bottom:6px;color:#64748b}
.filter-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.filter-chip{padding:4px 12px;border-radius:16px;border:1.5px solid #e2e8f0;background:#fff;cursor:pointer;font-size:.82rem;font-weight:500}
.filter-chip:hover{border-color:#2563eb}
.filter-chip.active{background:#2563eb;color:#fff;border-color:#2563eb}
.tab-content{display:none}.tab-content.active{display:block}
.item-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;flex-wrap:wrap}
.item-row .item-name{flex:2;min-width:120px;font-weight:600;font-size:.88rem}
.item-row .item-detail{flex:1;min-width:70px;font-size:.82rem;color:#64748b}
.item-row input[type=number]{width:70px;padding:4px 6px;border:1.5px solid #e2e8f0;border-radius:4px;font-size:.85rem}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:8px;padding:16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-card .number{font-size:1.5rem;font-weight:700;color:#2563eb}
.stat-card .label{font-size:.78rem;color:#64748b;margin-top:2px}
@media print{.header,.btn,.no-print,.filter-bar{display:none!important}.card{box-shadow:none;border:1px solid #ddd}body{background:#fff}}
</style>
</head>
<body>
<div class="header">
<div class="container">
<h1>LOTE Quote Builder</h1>
<nav>
<a onclick="showPage('quotes')" id="nav-quotes">Quotes</a>
<a onclick="showPage('rates')" id="nav-rates">Rates</a>
</nav>
</div>
</div>
<div class="container">
<div id="page-quotes" class="tab-content active"></div>
<div id="page-rates" class="tab-content"></div>
<div id="page-builder" class="tab-content"></div>
</div>
<div id="modal-root"></div>

<script>
// Local storage based data layer
const DB = {
  get(key, def=[]) { try { return JSON.parse(localStorage.getItem('lote_'+key)) || def; } catch { return def; } },
  set(key, val) { localStorage.setItem('lote_'+key, JSON.stringify(val)); },
  uuid() { return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16)}); }
};

// Initialize seed data if empty
function seedIfEmpty() {
  if (DB.get('rates').length > 0) return;
  const rates = [
    {category:'Translation',name:'Standard Translation',description:'General document translation',unit:'per word',unit_price:0.12},
    {category:'Translation',name:'Technical Translation',description:'Technical/specialized document translation',unit:'per word',unit_price:0.18},
    {category:'Translation',name:'Legal Translation',description:'Legal document translation with certification',unit:'per word',unit_price:0.22},
    {category:'Translation',name:'Medical Translation',description:'Medical/pharmaceutical translation',unit:'per word',unit_price:0.20},
    {category:'Translation',name:'Website Localization',description:'Full website content translation and localization',unit:'per word',unit_price:0.15},
    {category:'Editing',name:'Proofreading',description:'Grammar, spelling, and punctuation check',unit:'per word',unit_price:0.06},
    {category:'Editing',name:'Copy Editing',description:'Style, clarity, and consistency editing',unit:'per word',unit_price:0.08},
    {category:'Editing',name:'Substantive Editing',description:'Deep structural and content editing',unit:'per word',unit_price:0.10},
    {category:'Interpreting',name:'Phone Interpreting',description:'Over-the-phone interpretation',unit:'per minute',unit_price:1.50},
    {category:'Interpreting',name:'Video Interpreting',description:'Video remote interpretation',unit:'per minute',unit_price:2.00},
    {category:'Interpreting',name:'On-site Interpreting',description:'In-person consecutive interpreting',unit:'per hour',unit_price:75.00},
    {category:'Interpreting',name:'Conference Interpreting',description:'Simultaneous conference interpreting',unit:'per hour',unit_price:120.00},
    {category:'DTP',name:'Simple Layout',description:'Basic document formatting and layout',unit:'per page',unit_price:15.00},
    {category:'DTP',name:'Complex Layout',description:'Advanced layout with graphics and tables',unit:'per page',unit_price:30.00},
    {category:'DTP',name:'Graphic Design',description:'Custom graphic design work',unit:'per hour',unit_price:65.00},
    {category:'Project Management',name:'Project Management Fee',description:'Project coordination and management',unit:'flat rate',unit_price:150.00},
    {category:'Project Management',name:'Rush Surcharge',description:'Expedited delivery surcharge',unit:'percent',unit_price:25.00},
    {category:'Project Management',name:'Certification Fee',description:'Certified translation statement',unit:'per document',unit_price:35.00},
  ].map(r=>({...r,id:DB.uuid(),is_active:true,created_at:new Date().toISOString()}));
  DB.set('rates', rates);
}
seedIfEmpty();

let currentPage = 'quotes';
let currentQuoteId = null;

function showPage(page, quoteId) {
  currentPage = page;
  currentQuoteId = quoteId || null;
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.header nav a').forEach(a=>a.classList.remove('active'));
  if (page === 'builder') {
    document.getElementById('page-builder').classList.add('active');
    document.getElementById('nav-quotes').classList.add('active');
    renderBuilder();
  } else {
    document.getElementById('page-'+page).classList.add('active');
    const navEl = document.getElementById('nav-'+page);
    if(navEl) navEl.classList.add('active');
    if (page==='quotes') renderQuotes();
    else if (page==='rates') renderRates();
  }
}

function fmt(n) { return '$'+(n||0).toFixed(2); }

function genQuoteNum() {
  const quotes = DB.get('quotes');
  const year = new Date().getFullYear();
  return `Q-${year}-${String(quotes.length+1).padStart(4,'0')}`;
}

function calcQuote(quote) {
  const rates = DB.get('rates');
  const items = (quote.items||[]).map(item => {
    const rate = rates.find(r=>r.id===item.rate_id) || {};
    const ep = item.unit_price_override != null ? item.unit_price_override : (rate.unit_price||0);
    return {...item, name:rate.name, category:rate.category, unit:rate.unit, rate_unit_price:rate.unit_price, effective_unit_price:ep, line_total:ep*item.quantity};
  });
  const subtotal = items.reduce((s,i)=>s+i.line_total,0);
  const discountAmt = subtotal*(quote.discount_percent||0)/100;
  const afterDiscount = subtotal - discountAmt;
  const taxAmt = afterDiscount*(quote.tax_percent||0)/100;
  return {...quote, items, subtotal, discount_amount:discountAmt, tax_amount:taxAmt, total:afterDiscount+taxAmt};
}

// QUOTES PAGE
function renderQuotes() {
  const quotes = DB.get('quotes').map(calcQuote);
  const el = document.getElementById('page-quotes');

  const stats = {draft:0,sent:0,accepted:0,declined:0};
  quotes.forEach(q=>stats[q.status]=(stats[q.status]||0)+1);

  el.innerHTML = `
    <div class="page-header">
      <h2>Quotes</h2>
      <button class="btn btn-primary" onclick="showPage('builder')">+ New Quote</button>
    </div>
    <div class="stat-cards">
      <div class="stat-card"><div class="number">${quotes.length}</div><div class="label">Total Quotes</div></div>
      <div class="stat-card"><div class="number">${stats.draft}</div><div class="label">Drafts</div></div>
      <div class="stat-card"><div class="number">${stats.accepted}</div><div class="label">Accepted</div></div>
      <div class="stat-card"><div class="number">${fmt(quotes.reduce((s,q)=>s+q.total,0))}</div><div class="label">Total Value</div></div>
    </div>
    <div class="card">
    ${quotes.length===0 ? '<div class="empty-state"><h3>No quotes yet</h3><p>Create your first quote to get started.</p></div>' : `
      <table>
        <thead><tr><th>Quote #</th><th>Client</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${quotes.map(q=>`<tr onclick="showPage('builder','${q.id}')" style="cursor:pointer">
            <td><strong>${q.quote_number}</strong></td>
            <td>${q.client_name}${q.client_company?'<br><span style="font-size:.78rem;color:#64748b">'+q.client_company+'</span>':''}</td>
            <td>${q.items.length}</td>
            <td><strong>${fmt(q.total)}</strong></td>
            <td><span class="badge badge-${q.status}">${q.status}</span></td>
            <td onclick="event.stopPropagation()">
              <button class="btn btn-sm btn-danger" onclick="deleteQuote('${q.id}')">Del</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>`}
    </div>`;
}

function deleteQuote(id) {
  if (!confirm('Delete this quote?')) return;
  DB.set('quotes', DB.get('quotes').filter(q=>q.id!==id));
  renderQuotes();
}

// RATES PAGE
let rateFilter = '';
function renderRates() {
  const rates = DB.get('rates');
  const categories = [...new Set(rates.map(r=>r.category))].sort();
  const filtered = rateFilter ? rates.filter(r=>r.category===rateFilter) : rates;

  document.getElementById('page-rates').innerHTML = `
    <div class="page-header">
      <h2>Rate Card</h2>
      <button class="btn btn-primary" onclick="showRateModal()">+ Add Rate</button>
    </div>
    <div class="filter-bar">
      <button class="filter-chip ${!rateFilter?'active':''}" onclick="rateFilter='';renderRates()">All</button>
      ${categories.map(c=>`<button class="filter-chip ${rateFilter===c?'active':''}" onclick="rateFilter='${c}';renderRates()">${c}</button>`).join('')}
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Category</th><th>Service</th><th>Unit</th><th>Price</th><th></th></tr></thead>
        <tbody>
          ${filtered.map(r=>`<tr>
            <td><strong>${r.category}</strong></td>
            <td>${r.name}<br><span style="font-size:.78rem;color:#64748b">${r.description}</span></td>
            <td>${r.unit}</td>
            <td><strong>${fmt(r.unit_price)}</strong></td>
            <td>
              <button class="btn btn-sm btn-secondary" onclick="showRateModal('${r.id}')">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="deleteRate('${r.id}')">Del</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

function deleteRate(id) {
  if (!confirm('Delete this rate?')) return;
  DB.set('rates', DB.get('rates').filter(r=>r.id!==id));
  renderRates();
}

function showRateModal(id) {
  const rate = id ? DB.get('rates').find(r=>r.id===id) : null;
  const f = rate || {category:'',name:'',description:'',unit:'per word',unit_price:''};
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="closeModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>${rate?'Edit':'Add'} Rate</h3>
        <div class="form-group"><label>Category</label><input id="rf-cat" value="${f.category}" placeholder="e.g. Translation"></div>
        <div class="form-group"><label>Service Name</label><input id="rf-name" value="${f.name}" placeholder="e.g. Standard Translation"></div>
        <div class="form-group"><label>Description</label><textarea id="rf-desc" rows="2" placeholder="Brief description">${f.description}</textarea></div>
        <div class="row">
          <div class="form-group"><label>Unit</label>
            <select id="rf-unit">
              ${['per word','per page','per hour','per minute','per document','flat rate','percent','each'].map(u=>`<option ${f.unit===u?'selected':''}>${u}</option>`).join('')}
            </select>
          </div>
          <div class="form-group"><label>Unit Price ($)</label><input type="number" step="0.01" min="0" id="rf-price" value="${f.unit_price}"></div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveRate('${id||''}')">${rate?'Update':'Create'}</button>
        </div>
      </div>
    </div>`;
}

function saveRate(id) {
  const data = {category:document.getElementById('rf-cat').value, name:document.getElementById('rf-name').value, description:document.getElementById('rf-desc').value, unit:document.getElementById('rf-unit').value, unit_price:parseFloat(document.getElementById('rf-price').value)};
  if (!data.category||!data.name||isNaN(data.unit_price)) return alert('Please fill all required fields');
  let rates = DB.get('rates');
  if (id) { rates = rates.map(r=>r.id===id?{...r,...data}:r); }
  else { rates.push({...data, id:DB.uuid(), is_active:true, created_at:new Date().toISOString()}); }
  DB.set('rates', rates);
  closeModal();
  renderRates();
}

function closeModal() { document.getElementById('modal-root').innerHTML=''; }

// QUOTE BUILDER PAGE
function renderBuilder() {
  const rates = DB.get('rates').filter(r=>r.is_active);
  let quote;
  if (currentQuoteId) {
    quote = calcQuote(DB.get('quotes').find(q=>q.id===currentQuoteId));
  }

  const el = document.getElementById('page-builder');
  if (!quote) {
    // New quote form
    el.innerHTML = `
      <div class="page-header">
        <h2>New Quote</h2>
        <button class="btn btn-secondary" onclick="showPage('quotes')">Back</button>
      </div>
      <div class="card">
        <h3 style="margin-bottom:14px">Client Details</h3>
        <div class="row">
          <div class="form-group"><label>Client Name *</label><input id="qf-name" placeholder="Client name"></div>
          <div class="form-group"><label>Email</label><input id="qf-email" type="email" placeholder="client@example.com"></div>
          <div class="form-group"><label>Company</label><input id="qf-company" placeholder="Company name"></div>
        </div>
        <div class="form-group"><label>Notes</label><textarea id="qf-notes" rows="2" placeholder="Additional notes..."></textarea></div>
        <div class="row">
          <div class="form-group"><label>Discount (%)</label><input type="number" id="qf-disc" value="0" min="0" max="100" step="0.5"></div>
          <div class="form-group"><label>Tax (%)</label><input type="number" id="qf-tax" value="0" min="0" max="100" step="0.5"></div>
        </div>
        <button class="btn btn-primary" onclick="createNewQuote()">Create Quote</button>
      </div>`;
    return;
  }

  // Existing quote
  el.innerHTML = `
    <div class="page-header">
      <h2>${quote.quote_number}</h2>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <select id="status-sel" onchange="changeStatus()" style="padding:6px 10px;border-radius:6px;border:1.5px solid #e2e8f0;font-size:.85rem">
          ${['draft','sent','accepted','declined'].map(s=>`<option ${quote.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <button class="btn btn-secondary btn-sm" onclick="window.print()">Print</button>
        <button class="btn btn-secondary btn-sm" onclick="showPage('quotes')">Back</button>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px">
        <div><strong>${quote.client_name}</strong>${quote.client_company?' · '+quote.client_company:''}</div>
        <div style="color:#64748b;font-size:.85rem">${quote.client_email||''}</div>
      </div>
      ${quote.notes?'<div style="color:#64748b;font-size:.85rem;margin-bottom:8px">'+quote.notes+'</div>':''}
      <div class="row no-print" style="margin-bottom:12px">
        <div class="form-group"><label>Discount (%)</label><input type="number" id="eq-disc" value="${quote.discount_percent}" min="0" max="100" step="0.5" onchange="updateQuoteField()"></div>
        <div class="form-group"><label>Tax (%)</label><input type="number" id="eq-tax" value="${quote.tax_percent}" min="0" max="100" step="0.5" onchange="updateQuoteField()"></div>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h3>Line Items</h3>
        <button class="btn btn-primary btn-sm no-print" onclick="showAddItemModal()">+ Add Service</button>
      </div>
      ${quote.items.length===0?'<div class="empty-state"><h3>No items yet</h3><p>Add services from your rate card.</p></div>':''}
      ${quote.items.map((item,i)=>`
        <div class="item-row">
          <div class="item-name">${item.name}<br><span style="font-size:.75rem;color:#94a3b8">${item.category} · ${item.unit}</span></div>
          <div class="item-detail">Rate: <input type="number" step="0.01" min="0" value="${item.effective_unit_price}" onchange="updateItemPrice(${i},this.value)" class="no-print"> <span class="print-only" style="display:none">${fmt(item.effective_unit_price)}</span></div>
          <div class="item-detail">Qty: <input type="number" min="1" step="1" value="${item.quantity}" onchange="updateItemQty(${i},this.value)" class="no-print"> <span class="print-only" style="display:none">${item.quantity}</span></div>
          <div class="item-detail"><strong>${fmt(item.line_total)}</strong></div>
          <button class="btn btn-sm btn-danger no-print" onclick="removeItem(${i})">X</button>
        </div>`).join('')}
      ${quote.items.length>0?`
        <div class="totals-section">
          <div class="totals-row"><span class="totals-label">Subtotal</span><span>${fmt(quote.subtotal)}</span></div>
          ${quote.discount_percent>0?`<div class="totals-row"><span class="totals-label">Discount (${quote.discount_percent}%)</span><span>-${fmt(quote.discount_amount)}</span></div>`:''}
          ${quote.tax_percent>0?`<div class="totals-row"><span class="totals-label">Tax (${quote.tax_percent}%)</span><span>${fmt(quote.tax_amount)}</span></div>`:''}
          <div class="totals-row total"><span class="totals-label">Total</span><span>${fmt(quote.total)}</span></div>
        </div>`:''}
    </div>`;
}

function createNewQuote() {
  const name = document.getElementById('qf-name').value.trim();
  if (!name) return alert('Client name is required');
  const quote = {
    id: DB.uuid(), quote_number: genQuoteNum(), client_name: name,
    client_email: document.getElementById('qf-email').value,
    client_company: document.getElementById('qf-company').value,
    notes: document.getElementById('qf-notes').value,
    discount_percent: parseFloat(document.getElementById('qf-disc').value)||0,
    tax_percent: parseFloat(document.getElementById('qf-tax').value)||0,
    status: 'draft', items: [], created_at: new Date().toISOString()
  };
  const quotes = DB.get('quotes');
  quotes.push(quote);
  DB.set('quotes', quotes);
  currentQuoteId = quote.id;
  renderBuilder();
}

function changeStatus() {
  const quotes = DB.get('quotes');
  const q = quotes.find(q=>q.id===currentQuoteId);
  q.status = document.getElementById('status-sel').value;
  DB.set('quotes', quotes);
}

function updateQuoteField() {
  const quotes = DB.get('quotes');
  const q = quotes.find(q=>q.id===currentQuoteId);
  q.discount_percent = parseFloat(document.getElementById('eq-disc').value)||0;
  q.tax_percent = parseFloat(document.getElementById('eq-tax').value)||0;
  DB.set('quotes', quotes);
  renderBuilder();
}

function showAddItemModal() {
  const rates = DB.get('rates').filter(r=>r.is_active);
  const categories = [...new Set(rates.map(r=>r.category))].sort();
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="closeModal()">
      <div class="modal" onclick="event.stopPropagation()" style="max-width:650px">
        <h3>Add Service to Quote</h3>
        <div class="filter-bar" id="add-filter">
          <button class="filter-chip active" onclick="filterAddItems('')">All</button>
          ${categories.map(c=>`<button class="filter-chip" onclick="filterAddItems('${c}')">${c}</button>`).join('')}
        </div>
        <div id="add-items-list">
          ${rates.map(r=>`
            <div class="item-row" data-cat="${r.category}">
              <div class="item-name">${r.name}<br><span style="font-size:.75rem;color:#94a3b8">${r.category} · ${r.unit}</span></div>
              <div class="item-detail">${fmt(r.unit_price)}</div>
              <input type="number" min="1" value="1" id="addqty-${r.id}" style="width:60px;padding:4px;border:1.5px solid #e2e8f0;border-radius:4px">
              <button class="btn btn-sm btn-primary" onclick="addItemToQuote('${r.id}')">Add</button>
            </div>`).join('')}
        </div>
        <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Done</button></div>
      </div>
    </div>`;
}

function filterAddItems(cat) {
  document.querySelectorAll('#add-items-list .item-row').forEach(el=>{
    el.style.display = (!cat||el.dataset.cat===cat)?'flex':'none';
  });
  document.querySelectorAll('#add-filter .filter-chip').forEach(btn=>{
    btn.classList.toggle('active', btn.textContent===(cat||'All'));
  });
}

function addItemToQuote(rateId) {
  const qty = parseFloat(document.getElementById('addqty-'+rateId).value)||1;
  const quotes = DB.get('quotes');
  const q = quotes.find(q=>q.id===currentQuoteId);
  q.items.push({rate_id:rateId, quantity:qty, unit_price_override:null});
  DB.set('quotes', quotes);
  renderBuilder();
  showAddItemModal();
}

function updateItemQty(idx, val) {
  const qty = parseFloat(val); if(qty<=0) return;
  const quotes = DB.get('quotes');
  const q = quotes.find(q=>q.id===currentQuoteId);
  q.items[idx].quantity = qty;
  DB.set('quotes', quotes);
  renderBuilder();
}

function updateItemPrice(idx, val) {
  const quotes = DB.get('quotes');
  const q = quotes.find(q=>q.id===currentQuoteId);
  q.items[idx].unit_price_override = val===''?null:parseFloat(val);
  DB.set('quotes', quotes);
  renderBuilder();
}

function removeItem(idx) {
  const quotes = DB.get('quotes');
  const q = quotes.find(q=>q.id===currentQuoteId);
  q.items.splice(idx,1);
  DB.set('quotes', quotes);
  renderBuilder();
}

// Init
showPage('quotes');
</script>
</body>
</html>
